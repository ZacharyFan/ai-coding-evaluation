[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-workflow-evaluation"
version = "0.1.0"
description = "Repeatable benchmark protocol for comparing AI coding workflows on real engineering tasks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Zachary" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff==0.15.10",
]

[project.scripts]
ai-eval = "scripts.eval:main"

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "C4",
]
ignore = [
  "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
